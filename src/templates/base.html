<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ description|replace('\n', ' ') }}">
<meta name="color-scheme" content="light dark">
<title>{{ page_title }}</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="{{ prefix }}static/style.css">
<script defer src="{{ prefix }}static/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 바로 가기</a>
<header class="site-header"><div class="shell header-inner">
<a class="site-name" href="{{ prefix }}index.html">{{ profile.nickname }}<span class="brand-dot">.</span></a>
<nav aria-label="주 메뉴"><a href="{{ prefix }}index.html#work">프로젝트</a><a href="{{ profile.links.github }}">GitHub</a><a href="{{ prefix }}resume.pdf">이력서</a><button id="theme-toggle" type="button" aria-label="어두운 테마 전환" aria-pressed="false">테마 <span aria-hidden="true">◐</span></button></nav>
</div></header>
<main id="main">{% block main %}{% endblock %}</main>
<footer class="shell footer"><span>{{ profile.nickname }} · 포트폴리오</span><div><a href="{{ profile.links.github }}">GitHub</a><a href="{{ prefix }}resume.pdf" download>이력서 PDF</a><a href="#main">맨 위로 ↑</a></div></footer>
<dialog id="image-dialog" aria-label="이미지 확대"><button type="button" class="dialog-close" aria-label="닫기">닫기 ×</button><img alt=""><p></p></dialog>
</body></html>
